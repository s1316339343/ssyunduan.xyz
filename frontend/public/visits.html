<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>访问统计 · 云端小窝</title>
    <style>
      :root {
        color-scheme: light;
        font-family: 'MiSans', 'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        color: #1d4f5e;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.8), transparent 40%),
          linear-gradient(160deg, #dff5fb, #eefbf4);
      }
      .card {
        width: min(100%, 560px);
        padding: 26px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 20px 50px rgba(34, 105, 128, 0.14);
        backdrop-filter: blur(16px);
      }
      .eyebrow {
        margin: 0 0 6px;
        font: 10px/1.5 'Times New Roman', serif;
        letter-spacing: 2.5px;
        color: #7d9aa4;
      }
      h1 { margin: 0 0 4px; font-size: 24px; }
      .sub { margin: 0 0 18px; font-size: 12px; color: #71909a; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .stat {
        padding: 18px 14px;
        border-radius: 14px;
        text-align: center;
        background: rgba(244, 252, 253, 0.9);
        border: 1px solid rgba(208, 236, 241, 0.9);
      }
      .stat strong {
        display: block;
        font: 40px/1.1 'Times New Roman', serif;
        color: #1a6074;
      }
      .stat span {
        display: block;
        margin-top: 5px;
        font-size: 12px;
        font-weight: 700;
        color: #3d6a76;
      }
      .stat small { display: block; margin-top: 3px; font-size: 9px; color: #9aadb3; }
      .note {
        margin: 16px 0 0;
        padding-top: 12px;
        border-top: 1px dashed rgba(48, 112, 131, 0.16);
        font-size: 10.5px;
        line-height: 1.8;
        color: #7b959e;
      }
      @media (max-width: 420px) {
        .card { padding: 18px; }
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">PRIVATE COUNTER</p>
      <h1>访问统计</h1>
      <p class="sub">看看有没有人来过这个小窝。</p>
      <div class="grid">
        <div class="stat">
          <strong id="busuanzi_value_site_pv">—</strong>
          <span>本站总访问</span>
          <small>每次打开页面计一次</small>
        </div>
        <div class="stat">
          <strong id="busuanzi_value_site_uv">—</strong>
          <span>独立访客</span>
          <small>按浏览器粗略去重</small>
        </div>
      </div>
      <p class="note">
        数据来自 Busuanzi 免费计数器，仅作趋势参考。只统计公网页面，不包含 localhost 和局域网 IP；无法识别具体访客。
      </p>
    </main>
    <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
  </body>
</html>
