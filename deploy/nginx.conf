# 如果你更熟悉 Nginx，可以用这份配置。
# 证书路径按 certbot 生成的实际路径修改。
# 8080 只监听 127.0.0.1，不要直接暴露到公网。

server {
    listen 80;
    server_name yunduan.xyz www.yunduan.xyz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name yunduan.xyz www.yunduan.xyz;

    ssl_certificate     /etc/letsencrypt/live/yunduan.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yunduan.xyz/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
